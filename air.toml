# air formatter configuration
# https://posit-dev.github.io/air/configuration.html

[format]
line-width = 80
indent-width = 2
indent-style = "space"
line-ending = "lf"
persistent-line-breaks = true

# Generated or vendored paths that are not hand-authored R source.
exclude = ["node_modules/", "docs/local/", "**/renv/", "**/www/"]
